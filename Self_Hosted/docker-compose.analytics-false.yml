# Selected when ENABLE_ANALYTICS_API=false (the default).
# Apply changes with: docker compose up -d --remove-orphans
#
# The Analytics API is not started. This one-shot job also disables the
# metrics_reader database login (if a previous enablement created it) and ends
# any of its open sessions, so turning the feature off revokes database access.
# On a fresh install the role does not exist and the job changes nothing.
#
# YAML anchors do not cross Compose files, so the runtime hardening from
# docker-compose.yml is repeated here.

services:
  analytics-db-disable:
    image: postgres:18-alpine
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    privileged: false
    init: true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    # "$$" escapes "$" for Compose interpolation, so PostgreSQL receives "DO $$ ... $$".
    entrypoint:
      - psql
      - --no-psqlrc
      - --quiet
      - --host=postgres
      - --username=metrics_user
      - --dbname=metrics
      - --set=ON_ERROR_STOP=1
      - --command
      - >-
        DO $$$$ BEGIN
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'metrics_reader') THEN
        ALTER ROLE metrics_reader NOLOGIN;
        PERFORM pg_terminate_backend(pid) FROM pg_stat_activity WHERE usename = 'metrics_reader';
        END IF;
        END $$$$;
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      PGCONNECT_TIMEOUT: "5"
      PGOPTIONS: "-c lock_timeout=10s -c statement_timeout=30s"
      PGAPPNAME: avsm-analytics-db-disable
      HOME: /tmp
    networks:
      - db_net
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    pids_limit: 20
    mem_limit: 64m
    cpus: 0.25
    restart: "no"

  metrics-ingest:
    depends_on:
      # Lets "docker compose up --wait" (used by update.sh) treat the one-shot
      # job above as complete instead of as an exited service. "required: false"
      # keeps ingestion independent: if the job fails, ingestion still starts.
      analytics-db-disable:
        condition: service_completed_successfully
        required: false
