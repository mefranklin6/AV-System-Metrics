name: Visualizer App

# The Metrics Visualizer currently ships as a Windows desktop app, so CI
# analyzes, tests, and builds it on Windows. Other platforms (web, macOS,
# Linux) still compile from the same source but are not built or tested here.
on:
  push:
    paths:
      - "visualizer_app/**"
      - ".github/workflows/visualizer-app.yml"
  pull_request:
    paths:
      - "visualizer_app/**"
      - ".github/workflows/visualizer-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visualizer-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Analyze, test, and build the Metrics Visualizer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: visualizer_app/metrics_visualizer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the release the test suite was verified with; a new
          # stable release can add lints that fail "flutter analyze". Bump it
          # deliberately after running analyze and test locally.
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: metrics-visualizer-windows-x64
          path: visualizer_app/metrics_visualizer/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
