<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/".
    This placeholder is replaced by the `--base-href` argument of `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AV Metrics Visualizer: accessible dashboards of classroom AV room and device usage from AV System Metrics, for data-driven budget and system design decisions.">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AV Metrics">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AV Metrics Visualizer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #f4fbfa; color: #161d1d; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #0e1515; color: #dde4e3; } }
    noscript p { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-size: 1.125rem; line-height: 1.5; }
  </style>
</head>
<body>
  <noscript>
    <p>AV Metrics Visualizer needs JavaScript to run. Please enable JavaScript in your browser, or use the desktop version of the app.</p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
